name: Release

on:
  push:
    branches:
      - main

# id-token: write lets the shared workflow publish with npm trusted publishing (OIDC). The package's
# trusted publisher on npmjs.com names this file, release.yml.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    uses: enalmada/.github/.github/workflows/release.yml@main
